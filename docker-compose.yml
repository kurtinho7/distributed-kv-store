services:
  kvstore:
    build:
      context: ./server
    environment:
      KV_NODE_ID: node-1
      KV_ADDR: :8080
      KV_LOG_PATH: /data/kv.log
    ports:
      - "8080:8080"
    volumes:
      - kvstore-data:/data

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - kvstore

volumes:
  kvstore-data:
