services:
  node-1:
    build:
      context: ./server
    environment:
      KV_NODE_ID: node-1
      KV_LEADER_ID: node-1
      KV_ADDR: :8080
      KV_LOG_PATH: /data/kv.log
      KV_CLUSTER: node-1=http://node-1:8080,node-2=http://node-2:8080,node-3=http://node-3:8080
    ports:
      - "8080:8080"
    volumes:
      - node-1-data:/data

  node-2:
    build:
      context: ./server
    environment:
      KV_NODE_ID: node-2
      KV_LEADER_ID: node-1
      KV_ADDR: :8080
      KV_LOG_PATH: /data/kv.log
      KV_CLUSTER: node-1=http://node-1:8080,node-2=http://node-2:8080,node-3=http://node-3:8080
    ports:
      - "8081:8080"
    volumes:
      - node-2-data:/data

  node-3:
    build:
      context: ./server
    environment:
      KV_NODE_ID: node-3
      KV_LEADER_ID: node-1
      KV_ADDR: :8080
      KV_LOG_PATH: /data/kv.log
      KV_CLUSTER: node-1=http://node-1:8080,node-2=http://node-2:8080,node-3=http://node-3:8080
    ports:
      - "8082:8080"
    volumes:
      - node-3-data:/data

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - node-1
      - node-2
      - node-3

volumes:
  node-1-data:
  node-2-data:
  node-3-data:
